<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 加到手机主画面：一律叫「SIC乐韵」、用乐韵的 logo（不管从哪一页加） -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="SIC乐韵">
  <meta name="application-name" content="SIC乐韵">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#09090b">
  <title>后台权限 - 乐韵歌咏团</title>
  <script src="src/gate.js" data-require="grant"></script>
  <script src="src/nav.js" defer></script>
  <link rel="stylesheet" href="tailwind.css">
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-[100dvh] font-sans">
  <main class="max-w-2xl mx-auto px-4 py-6 pb-24">
    <header class="flex items-center justify-between mb-4">
      <h1 class="text-lg font-semibold">🔑 后台权限</h1>
      <button type="button" data-nav-open class="shrink-0 px-3 py-1.5 rounded-lg text-sm font-medium bg-white border border-slate-200 text-slate-600">☰ 菜单</button>
    </header>

    <!-- 最高权限才看得到这两个分页 -->
    <nav id="tabs" class="hidden grid grid-cols-2 gap-2 mb-4 text-sm">
      <button data-pane="people" class="py-2 rounded-lg font-semibold bg-indigo-600 text-white">👥 按人开通</button>
      <button data-pane="keys" class="py-2 rounded-lg font-semibold bg-white border border-slate-200 text-slate-600">🔑 共用密码</button>
    </nav>

    <div id="pane-people">
      <div id="intro" class="text-sm text-slate-600 mb-3"></div>
      <input id="m-q" type="search" placeholder="找名字…" class="w-full border border-slate-300 rounded-lg px-3 py-2 mb-2 text-sm bg-white">
      <div id="m-count" class="text-xs text-slate-500 px-1 mb-1.5"></div>
      <div id="m-list" class="bg-white rounded-2xl border border-slate-200 divide-y divide-slate-100 text-sm"></div>
      <details class="mt-4 bg-white rounded-2xl border border-slate-200 p-4 text-sm">
        <summary class="font-semibold cursor-pointer">🕘 最近谁开了什么</summary>
        <div id="log" class="mt-2 space-y-1 text-xs text-slate-600"></div>
      </details>
    </div>

    <div id="pane-keys" class="hidden">
      <p class="text-sm text-slate-600 mb-4">一个密码开固定几页，给一组人共用。平常用「按人开通」就好，这里是旧方法。
        <span class="text-slate-400">密码存进去之后，这里也看不到原本是什么，开好要自己记下来、发给负责的人。</span></p>

      <!-- 还在用旧密码 sic -->
      <section id="boot-box" class="hidden bg-amber-50 border border-amber-200 rounded-2xl p-4 mb-4 text-sm space-y-3">
        <div class="font-semibold text-amber-900">现在还在用旧密码 sic，先换成你自己的最高权限密码</div>
        <div class="text-amber-800">换了之后 sic 就不能用了，所有手机都要用新密码重新输一次。</div>
        <form id="boot-form" class="space-y-2">
          <input name="p1" type="password" autocomplete="new-password" placeholder="新的最高权限密码" class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-white">
          <input name="p2" type="password" autocomplete="new-password" placeholder="再输一次" class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-white">
          <button class="px-4 py-2 rounded-lg bg-amber-600 hover:bg-amber-500 text-white font-semibold">设好最高权限密码</button>
        </form>
      </section>

      <section id="list" class="space-y-3 mb-4"></section>

      <!-- 开一个新的 -->
      <section id="add-box" class="hidden bg-white rounded-2xl border border-slate-200 p-4 text-sm space-y-3">
        <div class="font-semibold">＋ 开一个新密码</div>
        <form id="add-form" class="space-y-3">
          <input name="name" placeholder="给谁用（例如：排歌组、职务组）" class="w-full border border-slate-300 rounded-lg px-3 py-2">
          <input name="pwd" type="text" autocomplete="off" placeholder="密码（至少 4 个字）" class="w-full border border-slate-300 rounded-lg px-3 py-2">
          <div>
            <div class="text-slate-500 mb-1.5">可以进哪几页</div>
            <div id="add-areas" class="grid sm:grid-cols-2 gap-1.5"></div>
          </div>
          <button class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold">开这个密码</button>
        </form>
      </section>
      <div id="k-status" class="text-xs text-slate-400 text-center mt-6"></div>
    </div>

    <!-- 保存状态：名单很长，放在画面下方随时看得到 -->
    <div id="status" class="empty:hidden fixed bottom-4 left-1/2 -translate-x-1/2 px-3 py-1.5 rounded-full bg-slate-800 text-white text-xs shadow-lg whitespace-nowrap z-50"></div>
  </main>
  <script src="src/login.js"></script>
  <script type="module" src="src/grant.js"></script>
</body>
</html>
