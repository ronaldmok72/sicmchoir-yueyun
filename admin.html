<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>指挥后台 - 乐谱排单</title>
  <script src="https://cdn.tailwindcss.com"></script>

</head>

  <!-- 专属开发者签名 (Watermark) -->

    Crafted by Ronald Mok
  </div>


<body class="bg-slate-50 h-[100dvh] pb-12 sm:pb-0 flex overflow-hidden font-sans text-slate-800 selection:bg-indigo-100 selection:text-indigo-900">
  <!-- ========================================== -->
  <!-- 2. 主内容区 (Main Content) -->
  <!-- ========================================== -->
  <div class="flex-1 flex flex-col h-[100dvh] overflow-hidden relative">
    
    <!-- 顶部 Header (Glassmorphism) -->
    <header class="h-16 bg-white/80 backdrop-blur-md border-b border-slate-200/60 flex items-center justify-between px-4 lg:px-6 sticky top-0 z-30 shrink-0">
      <div class="flex items-center gap-3">
        <!-- 手机端汉堡菜单 -->
        <button class="sm:hidden p-2 -ml-2 text-slate-500 hover:bg-slate-100 rounded-lg">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <h1 class="text-lg font-bold text-slate-800 hidden sm:block">主日弥撒排单</h1>
        <a href="mass.html" class="text-sm font-medium text-indigo-600 hover:text-indigo-800 whitespace-nowrap">按位置排歌 →</a>
      </div>

      <!-- 全局发布控制区 -->
      <div class="flex items-center gap-3">
        <div class="hidden sm:flex items-center gap-2 text-xs font-medium text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-full border border-emerald-100">
          <span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span></span>
          已保存
        </div>

        <input type="text" id="setlist-name" placeholder="例如: 5月10日 母亲节" class="w-40 sm:w-56 px-3 py-1.5 bg-slate-100 border-transparent focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 rounded-lg text-sm transition-all font-medium text-slate-700">
        <button onclick="handlePublish()" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold rounded-lg shadow-md shadow-indigo-200 transition-all flex items-center gap-1.5 active:scale-95">
          发布排单
        </button>
      </div>

  </header>

    <!-- ========================================== -->
    <!-- 3. 工作区 (Workspace) - 响应式三栏/Tabs -->
    <!-- ========================================== -->
    <main class="flex-1 overflow-hidden flex flex-col p-2 sm:p-4 relative">

      <!-- 手机端 Tabs (仅在小屏幕显示) -->
      <div class="sm:hidden flex bg-slate-200/50 p-1 rounded-xl mb-3 shrink-0">
        <button onclick="switchTab('library')" id="tab-library" class="flex-1 py-2 text-sm font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition-all">曲库</button>
        <button onclick="switchTab('setlist')" id="tab-setlist" class="flex-1 py-2 text-sm font-bold rounded-lg text-slate-500 hover:text-slate-700 transition-all">排单</button>
        <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-2 text-sm font-bold rounded-lg text-slate-500 hover:text-slate-700 transition-all">历史</button>
      </div>

      <!-- 三栏容器 -->
      <div class="flex-1 flex flex-col sm:flex-row gap-2 sm:gap-4 overflow-hidden">

        <!-- 左栏：历史排单 (默认在手机端隐藏) -->
        <div id="pane-history" class="hidden sm:flex w-full sm:w-44 md:w-64 lg:w-72 flex-col bg-white rounded-2xl shadow-sm border border-slate-200/60 overflow-hidden shrink-0 h-full">
          <div class="p-3 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
            <h2 class="text-sm font-bold text-slate-700">历史排单</h2>
          </div>
          <div id="history-list" class="flex-1 overflow-y-auto p-2 space-y-2 custom-scrollbar">
            <!-- JS 渲染区域 -->
          </div>
        </div>

        <!-- 中栏：曲库 (手机端默认显示) -->
        <div id="pane-library" class="flex flex-1 min-w-0 flex-col bg-white rounded-2xl shadow-sm border border-slate-200/60 overflow-hidden h-full">
          <div class="p-3 border-b border-slate-100 bg-slate-50/50 flex flex-col gap-2">
            <div class="flex justify-between items-center">
              <h2 class="text-sm font-bold text-slate-700">曲库 (Library)</h2>
              <button onclick="openAddSongModal()" class="px-3 py-1 bg-indigo-50 text-indigo-600 text-xs font-bold rounded-md hover:bg-indigo-100 transition-colors">➕ 新歌</button>
            </div>
            <input type="text" id="search-input" placeholder="搜索歌名/拼音..." class="w-full px-3 py-1.5 bg-white border border-slate-200 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-200 rounded-lg text-sm transition-all">
          </div>
          <div id="library-list" class="flex-1 overflow-y-auto p-2 space-y-2 custom-scrollbar">
            <!-- JS 渲染区域 -->
          </div>
        </div>

        <!-- 右栏：当前排单 (默认在手机端隐藏) -->
        <div id="pane-setlist" class="hidden sm:flex w-full sm:w-56 md:w-80 lg:w-96 flex-col bg-white rounded-2xl shadow-sm border border-slate-200/60 overflow-hidden shrink-0 h-full">
          <div class="p-3 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
            <div class="flex items-center gap-2">
              <h2 class="text-sm font-bold text-slate-700">当前排单</h2>
              <!-- 🌟 新建按钮移到了这里，永远可见！ -->
              <button onclick="window.createNewSetlist()" class="px-2 py-1 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold rounded-md transition-all flex items-center gap-1 active:scale-95" title="清空并新建">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                新建
              </button>
            </div>
            <span id="setlist-count" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded-md">0 首</span>
          </div>
          <div id="setlist-area" class="flex-1 overflow-y-auto p-2 space-y-2 custom-scrollbar bg-slate-50/30">
            <!-- JS 渲染区域 -->
          </div>
        </div>


      </div>
    </main>
  </div>

  <!-- UI 交互脚本 (不影响业务逻辑) -->
  <script>
    // 手机端 Tab 切换逻辑
    function switchTab(tabName) {
      // 重置所有 Tab 按钮样式
      ['library', 'setlist', 'history'].forEach(name => {
        const btn = document.getElementById(`tab-${name}`);
        btn.className = "flex-1 py-2 text-sm font-bold rounded-lg text-slate-500 hover:text-slate-700 transition-all";
      });
      // 激活当前 Tab 按钮
      const activeBtn = document.getElementById(`tab-${tabName}`);
      activeBtn.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition-all";

      // 隐藏所有面板，显示目标面板 (仅在手机端生效，md 以上由 CSS 控制)
      ['history', 'library', 'setlist'].forEach(name => {
        const pane = document.getElementById(`pane-${name}`);
        if (name === tabName) {
          pane.classList.remove('hidden');
          pane.classList.add('flex');
        } else {
          pane.classList.remove('flex');
          pane.classList.add('hidden');
        }
      });
    }
  </script>


  <!-- 预览模态框 (Modal) -->
  <div id="preview-modal" class="fixed inset-0 bg-slate-900/60 z-50 hidden opacity-0 transition-all duration-300 flex items-center justify-center p-4 backdrop-blur-md">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col overflow-hidden border border-slate-200/50 transform scale-95 transition-transform duration-300" id="preview-modal-content">
      <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-white/80 backdrop-blur-sm sticky top-0">
        <h3 id="modal-title" class="font-bold text-slate-800 text-lg flex items-center gap-2">
          <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
          曲谱预览
        </h3>
        <button onclick="closeModal()" class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <div class="flex-1 overflow-auto p-6 bg-slate-100/50 flex justify-center items-start custom-scrollbar">
        <img id="modal-image" src="" alt="Score Preview" class="max-w-full h-auto object-contain shadow-sm rounded-xl border border-slate-200/60 bg-white">
      </div>
    </div>
  </div>

  <!-- 智能批量上传歌曲模态框 -->
  <div id="add-song-modal" class="fixed inset-0 bg-slate-900/60 z-50 hidden opacity-0 transition-all duration-300 flex items-center justify-center p-4 backdrop-blur-md">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md flex flex-col overflow-hidden border border-slate-200/50 transform scale-95 transition-transform duration-300" id="add-song-modal-content">
      <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-white/80 backdrop-blur-sm">
        <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
          <svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
          批量上传 / 覆盖曲目
        </h3>
        <button onclick="closeAddSongModal()" class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <div class="p-6 space-y-5 bg-slate-50/30">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">选择乐谱图片 (可一次性多选)</label>
          <div class="relative group">
            <input type="file" id="new-song-file" accept="image/*" multiple class="w-full px-4 py-3 border-2 border-dashed border-slate-300 rounded-xl focus:ring-emerald-500 focus:border-emerald-500 bg-white hover:bg-slate-50 transition-colors cursor-pointer text-sm text-slate-600 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
          </div>
          <div class="mt-3 flex items-start gap-2 text-xs text-slate-500 bg-blue-50/50 p-3 rounded-lg border border-blue-100/50">
            <svg class="w-4 h-4 text-blue-500 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <p>系统会自动使用照片的名字作为歌名。如果名字已存在，会自动覆盖旧谱子。</p>
          </div>
        </div>
        <button id="btn-upload-save" onclick="uploadAndSaveSong()" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl shadow-md shadow-emerald-200 transition-all flex justify-center items-center gap-2 active:scale-95">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
          开始批量上传
        </button>
      </div>
    </div>

  <!-- 核心逻辑脚本 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getFirestore, doc, setDoc, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
    import { LIBRARY_DATA } from "./src/library.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD77WKlfYpUS1MJKu5J_xdV3adMZc5-c8U",
      authDomain: "sicmchoir-yueyun.firebaseapp.com",
      projectId: "sicmchoir-yueyun",
      storageBucket: "sicmchoir-yueyun.firebasestorage.app",
      messagingSenderId: "55940456186",
      appId: "1:55940456186:web:3a4a78dfb8c430f3963343"
    };

    const app = initializeApp(firebaseConfig );
    const db = getFirestore(app);

    // --- 真实曲库数据（在 src/library.js）---

    let currentSetlist = [];

    const searchInput = document.getElementById('search-input');
    const libraryListEl = document.getElementById('library-list');
    const setlistAreaEl = document.getElementById('setlist-area');
    const setlistCountEl = document.getElementById('setlist-count');
    const previewModal = document.getElementById('preview-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalImage = document.getElementById('modal-image');
    const historyListEl = document.getElementById('history-list');
    const addSongModal = document.getElementById('add-song-modal'); // 新增：上传弹窗

    // --- 初始化与拉取云端新歌 ---
    window.init = async function() {
      try {
        const querySnapshot = await getDocs(collection(db, "custom_songs"));
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const existingIndex = LIBRARY_DATA.findIndex(s => s.id === data.id);
          if (existingIndex !== -1) {
            // 🌟 暴力覆盖：直接替换整个对象，确保图片链接绝对更新
            LIBRARY_DATA[existingIndex] = data;
          } else {
            LIBRARY_DATA.push(data);
          }
        });
      } catch (e) {
        console.log("加载自定义歌曲失败", e);
      }

      window.renderLibrary();
      window.renderSetlist();
      window.loadHistory();
      if(searchInput) searchInput.addEventListener('input', window.renderLibrary);
    };



    // --- 曲库渲染逻辑 (Spotify Track Style) ---
    window.renderLibrary = function() {
      const query = searchInput ? searchInput.value.toLowerCase().trim() : '';
      libraryListEl.innerHTML = '';

      const filtered = LIBRARY_DATA.filter(song => {
        return song.title.toLowerCase().includes(query);
      });

      if (filtered.length === 0) {
        libraryListEl.innerHTML = `
          <div class="flex flex-col items-center justify-center py-16 text-slate-400">
            <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-4">
              <svg class="w-8 h-8 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <p class="text-sm font-bold text-slate-600">未找到相关曲目</p>
            <p class="text-xs text-slate-400 mt-1">请尝试其他拼音或关键字</p>
          </div>`;
        return;
      }

      filtered.forEach(song => {
        const item = document.createElement('div');
        // Spotify 风格：平时无边框，Hover 时出现浅色背景和微阴影
        item.className = "group flex items-center justify-between p-2.5 bg-white rounded-xl border border-transparent hover:border-slate-200/60 hover:bg-slate-50 hover:shadow-sm transition-all duration-200 cursor-default";
        
        // 智能生成 Badge (根据歌名猜测类型，增加视觉丰富度)
        let badgeText = "弥撒曲";
        let badgeColor = "bg-slate-100 text-slate-500";
        if(song.title.includes("进堂")) { badgeText = "进堂咏"; badgeColor = "bg-emerald-50 text-emerald-600 border-emerald-100"; }
        else if(song.title.includes("奉献")) { badgeText = "奉献咏"; badgeColor = "bg-amber-50 text-amber-600 border-amber-100"; }
        else if(song.title.includes("领主")) { badgeText = "领主咏"; badgeColor = "bg-blue-50 text-blue-600 border-blue-100"; }
        else if(song.title.includes("圣诞")) { badgeText = "圣诞期"; badgeColor = "bg-red-50 text-red-600 border-red-100"; }

        item.innerHTML = `
          <div class="flex items-center gap-3 overflow-hidden pr-2 min-w-0">
            <!-- 音乐 Icon -->
            <div class="w-10 h-10 rounded-lg bg-slate-100 flex items-center justify-center text-slate-400 group-hover:bg-indigo-100 group-hover:text-indigo-600 transition-colors shrink-0 relative overflow-hidden">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
            </div>

            <div class="flex flex-col overflow-hidden min-w-0">
              <span class="font-bold text-sm text-slate-700 group-hover:text-indigo-700 transition-colors truncate">${song.title}</span>
              <div class="flex items-center gap-2 mt-0.5">
                <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded border whitespace-nowrap ${badgeColor}">${badgeText}</span>
              </div>
            </div>
          </div>
          
          <!-- 操作区 (手机/平板常驻显示，电脑端Hover显现) -->
          <div class="flex items-center gap-1 shrink-0 opacity-100 md:opacity-0 group-hover:opacity-100 transition-all duration-200 md:translate-x-2 group-hover:translate-x-0">
            <button class="p-2 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors" onclick="window.openPreview('${song.id}')" title="预览乐谱">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            </button>
            <button class="p-2 bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white rounded-lg transition-colors shadow-sm" onclick="window.addToSetlist('${song.id}')" title="添加到排单">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
            </button>
            <!-- 🌟 删除按钮开放给所有歌曲 -->
            <button class="p-2 text-slate-400 hover:text-white hover:bg-red-500 rounded-lg transition-colors shadow-sm" onclick="event.stopPropagation(); window.deleteLibrarySong('${song.id}')" title="永久删除此歌">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
          </div>



        `;
        libraryListEl.appendChild(item);
      });
    };



    window.addToSetlist = function(id) {
      const song = LIBRARY_DATA.find(s => s.id === id);
      if (!song) return;
      const setlistItem = { ...song, uuid: Date.now().toString() + Math.random() };
      currentSetlist.push(setlistItem);
      window.renderSetlist();
      
      // 🌟 自动清空搜索框，方便立刻搜下一首
      const searchInput = document.getElementById('search-input');
      if (searchInput && searchInput.value !== '') {
        searchInput.value = '';
        window.renderLibrary();
      }
    };


    window.removeFromSetlist = function(uuid) {
      currentSetlist = currentSetlist.filter(item => item.uuid !== uuid);
      window.renderSetlist();
    };

    window.moveItem = function(index, direction) {
      if (direction === 'up' && index > 0) {
        const temp = currentSetlist[index];
        currentSetlist[index] = currentSetlist[index - 1];
        currentSetlist[index - 1] = temp;
      } else if (direction === 'down' && index < currentSetlist.length - 1) {
        const temp = currentSetlist[index];
        currentSetlist[index] = currentSetlist[index + 1];
        currentSetlist[index + 1] = temp;
      } else if (direction === 'top' && index > 0) {
        const item = currentSetlist.splice(index, 1)[0];
        currentSetlist.unshift(item); // 移到最前
      } else if (direction === 'bottom' && index < currentSetlist.length - 1) {
        const item = currentSetlist.splice(index, 1)[0];
        currentSetlist.push(item); // 移到最后
      }
      window.renderSetlist();
    };


    // --- 拖拽排序全局变量 ---
    let dragStartIndex = null;

    // --- 当前排单渲染逻辑 (上下移动按钮版) ---

          <div class="flex flex-col items-center justify-center py-20 text-slate-400 border-2 border-dashed border-slate-200/80 rounded-2xl bg-slate-50/50 mx-2 mt-2">
            <div class="w-16 h-16 bg-white rounded-full shadow-sm flex items-center justify-center mb-4">
              <svg class="w-8 h-8 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
            </div>
            <p class="text-sm font-bold text-slate-600">排单空空如也</p>

      }

      currentSetlist.forEach((item, index) => {

        card.innerHTML = `
          <!-- 左侧：序号 -->
          <div class="w-10 flex flex-col items-center justify-center bg-slate-50/80 border-r border-slate-100 py-2 shrink-0 text-slate-400 font-bold text-sm">
            ${index + 1}

          <!-- 中间：歌曲信息 -->
          <div class="flex-1 p-3 flex flex-col justify-center pointer-events-none">
            <span class="font-bold text-slate-700 text-sm leading-tight">${item.title}</span>

          <!-- 右侧：预览/置顶/上移/下移/置底/删除 按钮 -->
          <div class="flex items-center pr-2 gap-0.5">
            
            <!-- 🌟 新增：预览按钮 -->
            <button onclick="event.stopPropagation(); window.openPreview('${item.id}')" class="p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all" title="预览乐谱">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            </button>

            <!-- 置顶 (双箭头向上) -->
            <button onclick="event.stopPropagation(); window.moveItem(${index}, 'top')" class="p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all ${index === 0 ? 'invisible' : ''}" title="直接置顶">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 11l7-7 7 7M5 19l7-7 7 7"></path></svg>
            </button>
            
            <!-- 上移 -->
            <button onclick="event.stopPropagation(); window.moveItem(${index}, 'up')" class="p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all ${index === 0 ? 'invisible' : ''}" title="上移">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 15l7-7 7 7"></path></svg>
            </button>
            
            <!-- 下移 -->
            <button onclick="event.stopPropagation(); window.moveItem(${index}, 'down')" class="p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all ${index === currentSetlist.length - 1 ? 'invisible' : ''}" title="下移">

            <button onclick="event.stopPropagation(); window.moveItem(${index}, 'bottom')" class="p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all ${index === currentSetlist.length - 1 ? 'invisible' : ''}" title="直接置底">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 13l-7 7-7-7m14-8l-7 7-7-7"></path></svg>
            </button>

            <!-- 删除按钮 -->
            <button onclick="event.stopPropagation(); window.removeFromSetlist('${item.uuid}')" class="p-1.5 text-slate-300 hover:text-white hover:bg-red-500 rounded-lg transition-all shadow-sm ml-1" title="移除此曲目">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>

        setlistAreaEl.appendChild(card);

    };


// --- 预览弹窗逻辑 (带缩放动画) ---
    window.openPreview = function(id) {
      const song = LIBRARY_DATA.find(s => s.id === id);
      if (!song) return;
      modalTitle.innerHTML = `
        <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
        ${song.title}
      `;
      modalImage.src = song.imageUrl;
      
      const content = document.getElementById('preview-modal-content');
      previewModal.classList.remove('hidden');
      void previewModal.offsetWidth; // 触发重绘
      
      // 背景淡入，内容放大
      previewModal.classList.remove('opacity-0');
      previewModal.classList.add('opacity-100');
      content.classList.remove('scale-95');
      content.classList.add('scale-100');
    };

    window.closeModal = function() {
      const content = document.getElementById('preview-modal-content');
      
      // 背景淡出，内容缩小
      previewModal.classList.remove('opacity-100');
      previewModal.classList.add('opacity-0');
      content.classList.remove('scale-100');
      content.classList.add('scale-95');
      
      setTimeout(() => {
        previewModal.classList.add('hidden');
        modalImage.src = ''; 
      }, 300);
    };

    // --- 历史排单逻辑 (Notion Card Style) ---
    window.loadHistory = async function() {
      historyListEl.innerHTML = `
        <div class="flex flex-col items-center justify-center py-10 text-slate-400">
          <svg class="w-6 h-6 mb-3 animate-spin opacity-50" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
          <span class="text-xs font-medium">加载中...</span>
        </div>`;
        
      try {
        const querySnapshot = await getDocs(collection(db, "setlists"));
        historyListEl.innerHTML = '';
        
        if (querySnapshot.empty) {
          historyListEl.innerHTML = `
            <div class="flex flex-col items-center justify-center py-12 text-slate-400 border-2 border-dashed border-slate-200/60 rounded-2xl bg-slate-50/50 mx-1 mt-2">
              <svg class="w-10 h-10 mb-3 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
              <span class="text-sm font-medium">暂无历史排单</span>
            </div>`;
          return;
        }

        let historyItems = [];
        querySnapshot.forEach((doc) => {
          historyItems.push({ id: doc.id, ...doc.data() });
        });

        historyItems.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

        historyItems.forEach(item => {
          const div = document.createElement('div');
          // Notion 风格卡片：大圆角、微阴影、Hover 边框变色
          div.className = "group relative p-4 bg-white rounded-2xl border border-slate-200/60 hover:border-indigo-300 hover:shadow-md hover:shadow-indigo-500/5 transition-all duration-200 cursor-pointer overflow-hidden";
          
          const dateStr = new Date(item.createdAt).toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
          
          div.innerHTML = `
            <!-- 左侧 Hover 强调线 -->
            <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-gradient-to-b from-indigo-400 to-purple-500 opacity-0 group-hover:opacity-100 transition-opacity duration-200"></div>
            
            <div class="flex justify-between items-start mb-3" onclick="window.loadSetlist('${item.id}')">
              <div class="flex items-start gap-2.5 pr-6">
                <div class="mt-0.5 w-6 h-6 rounded-md bg-indigo-50 flex items-center justify-center text-indigo-500 shrink-0 group-hover:scale-110 transition-transform">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                </div>
                <span class="font-bold text-slate-800 text-sm group-hover:text-indigo-700 transition-colors leading-snug">${item.name}</span>
              </div>
            </div>
            
            <div class="flex justify-between items-center mt-auto">
              <div class="flex items-center gap-2.5">
                <span class="text-xs font-semibold text-slate-600 bg-slate-100 px-2.5 py-1 rounded-md">${item.items.length} 首</span>
                <span class="text-xs font-medium text-slate-400 flex items-center gap-1">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                  ${dateStr}
                </span>
              </div>
              
              <!-- Hover 时才出现的删除按钮 -->
              <button onclick="event.stopPropagation(); window.deleteSetlist('${item.id}')" class="absolute right-3 bottom-3 p-1.5 text-slate-300 hover:text-white hover:bg-red-500 rounded-lg transition-all opacity-0 group-hover:opacity-100 translate-y-1 group-hover:translate-y-0 shadow-sm" title="删除排单">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
              </button>
            </div>
          `;
          historyListEl.appendChild(div);
        });
      } catch (error) {
        console.error("获取历史排单失败:", error);
        historyListEl.innerHTML = `
          <div class="flex flex-col items-center justify-center py-10 text-red-400">
            <svg class="w-8 h-8 mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span class="text-xs font-medium">加载失败，请重试</span>
          </div>`;
      }
    };



    window.loadSetlist = function(id) {
      if(confirm(`确定要加载排单【${id}】吗？当前未发布的排单将被覆盖。`)) {
        getDocs(collection(db, "setlists")).then(snapshot => {
          snapshot.forEach(doc => {
            if(doc.id === id) {
              const data = doc.data();
              document.getElementById('setlist-name').value = data.name;
              currentSetlist = data.items.map(song => ({ ...song, uuid: Date.now().toString() + Math.random() }));
              window.renderSetlist();
            }
          });
        });
      }
    };

    window.deleteSetlist = async function(id) {
      if(confirm(`🚨 警告：确定要永久删除排单【${id}】吗？此操作不可恢复！`)) {
        try {
          // 注意：这里需要确保顶部 import 了 deleteDoc
          // import { ..., deleteDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
          await deleteDoc(doc(db, "setlists", id ));
          alert(`✅ 已删除排单：${id}`);
          window.loadHistory(); 
        } catch (error) {
          console.error("删除失败:", error);
          alert("❌ 删除失败，请检查网络。");
        }
      }
    };

    window.handlePublish = async function() {
      if (currentSetlist.length === 0) {
        alert("排单为空，不能发布！");
        return;
      }
      const setNameInput = document.getElementById('setlist-name').value.trim();
      if (!setNameInput) {
        alert("请先输入排单名称！（例如：5月10日 常年期）");
        return;
      }

      const payload = currentSetlist.map((item, index) => ({
        id: item.id, order: index + 1, title: item.title, imageUrl: item.imageUrl
      }));

      try {
        const docRef = doc(db, "setlists", setNameInput);
        await setDoc(docRef, {
          name: setNameInput,
          createdAt: new Date().toISOString(),
          items: payload
        });
        alert(`🎉 成功发布/保存排单：【${setNameInput}】！`);
        window.loadHistory(); 
      } catch (error) {
        console.error("发布失败: ", error);
        alert("❌ 发布失败，请检查网络连接。");
      }
    };

// --- 智能批量上传弹窗逻辑 (带缩放动画) ---
    window.openAddSongModal = function() {
      document.getElementById('new-song-file').value = '';
      const content = document.getElementById('add-song-modal-content');
      
      addSongModal.classList.remove('hidden');
      void addSongModal.offsetWidth; // 触发重绘
      
      // 背景淡入，内容放大
      addSongModal.classList.remove('opacity-0');
      addSongModal.classList.add('opacity-100');
      content.classList.remove('scale-95');
      content.classList.add('scale-100');
    };

    window.closeAddSongModal = function() {
      const content = document.getElementById('add-song-modal-content');
      
      // 背景淡出，内容缩小
      addSongModal.classList.remove('opacity-100');
      addSongModal.classList.add('opacity-0');
      content.classList.remove('scale-100');
      content.classList.add('scale-95');
      
      setTimeout(() => addSongModal.classList.add('hidden'), 300);
    };

    // --- 智能批量上传弹窗逻辑 ---
    window.uploadAndSaveSong = async function() {
      const fileInput = document.getElementById('new-song-file');
      const btn = document.getElementById('btn-upload-save');

      if (!fileInput.files || fileInput.files.length === 0) {
        alert("请先选择至少一张乐谱图片！");
        return;
      }

      const files = fileInput.files;
      const total = files.length;
      let successCount = 0;
      let updateCount = 0;
      
      btn.disabled = true;
      btn.classList.replace('bg-emerald-500', 'bg-slate-400');

      for (let i = 0; i < total; i++) {
        const file = files[i];
        // 提取纯歌名（去掉 .jpg/.png）
        let cleanName = file.name.replace(/\.[^/.]+$/, ""); 
        
        btn.innerHTML = `正在上传 (${i + 1}/${total}): ${cleanName}...`;

        try {
          // 🌟 终极杀招：偷偷给文件名加上时间戳，强制 Cloudinary 认为这是一张全新的图片！
          const extension = file.name.split('.').pop(); // 获取后缀名
          const uniqueFilename = cleanName + "_" + Date.now() + "_" + i + "." + extension;
          // 创建一个改过名字的新文件对象
          const newFile = new File([file], uniqueFilename, { type: file.type });

          const formData = new FormData();
          formData.append('file', newFile); // ⚠️ 注意：这里上传的是改名后的新文件！
          formData.append('upload_preset', 'ml_default');

          const cloudRes = await fetch('https://api.cloudinary.com/v1_1/dsfhilcgz/image/upload', {
            method: 'POST',
            body: formData
          } );
          const cloudData = await cloudRes.json();
          
          if (!cloudData.secure_url) throw new Error("Cloudinary 上传失败");
          
          // 获取全新的图片链接
          const imageUrl = cloudData.secure_url;

          let existingIndex = LIBRARY_DATA.findIndex(s => s.title === cleanName);
          let songId = "song_custom_" + Date.now() + "_" + i; 
          let isUpdate = false;

          if (existingIndex !== -1) {
            songId = LIBRARY_DATA[existingIndex].id; 
            isUpdate = true;
          }

          const songData = { id: songId, title: cleanName, imageUrl: imageUrl };

          // 保存到 Firebase
          await setDoc(doc(db, "custom_songs", songId), songData);

          // 暴力更新本地数据
          if (isUpdate) {
            LIBRARY_DATA[existingIndex] = songData;
            updateCount++;
          } else {
            LIBRARY_DATA.push(songData);
            successCount++;
          }
        } catch (error) {
          console.error(`上传 ${cleanName} 失败:`, error);
          alert(`上传 ${cleanName} 失败: ` + error.message);
        }
      }

      btn.disabled = false;
      btn.innerHTML = `开始批量上传`;
      btn.classList.replace('bg-slate-400', 'bg-emerald-500');
      
      window.renderLibrary();
      window.closeAddSongModal();
      
      alert(`✅ 批量处理完成！\n新增: ${successCount} 首\n覆盖更新: ${updateCount} 首`);
    };


    // --- 删除曲库歌曲逻辑 ---
    window.deleteLibrarySong = async function(id) {
      if(confirm('🚨 警告：确定要从曲库中永久删除这首歌吗？')) {
        try {
          // 强制从 Firebase 数据库中删除
          await deleteDoc(doc(db, "custom_songs", id));
          
          // 从本地数组中移除
          const index = LIBRARY_DATA.findIndex(s => s.id === id);
          if (index > -1) {
            LIBRARY_DATA.splice(index, 1);
          }
          
          // 重新渲染曲库列表
          window.renderLibrary();
          alert('✅ 歌曲已成功删除！\n(注：如果是系统自带的默认老歌，刷新页面后会恢复原状)');
        } catch (error) {
          console.error("删除歌曲失败:", error);
          alert('❌ 删除失败: ' + error.message);
        }
      }
    };



    document.addEventListener('DOMContentLoaded', window.init);
  </script>
