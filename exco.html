<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 加到手机主画面：一律叫「SIC乐韵」、用乐韵的 logo（不管从哪一页加） -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="SIC乐韵">
  <meta name="application-name" content="SIC乐韵">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#09090b">
  <title>执委团 - 乐韵歌咏团</title>
  <script src="src/i18n.js"></script>
  <script src="src/gate.js"></script>
  <script src="src/nav.js" defer></script>
  <link rel="stylesheet" href="tailwind.css">
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-[100dvh] font-sans">
  <main class="max-w-2xl mx-auto px-4 py-5 pb-24">

    <header class="flex flex-wrap items-end justify-between gap-3 mb-4">
      <div>
        <div class="text-xs text-slate-400 tracking-widest">SIC 乐韵歌咏团</div>
        <h1 class="text-xl font-semibold">执委团</h1>
      </div>
      <button type="button" data-nav-open class="shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium bg-white hover:bg-indigo-50 text-slate-700 border border-slate-200 shadow-sm">☰ 菜单</button>
    </header>

    <div id="loading" class="text-sm text-slate-400 text-center py-10">读取中…</div>
    <div id="body" class="hidden space-y-4">
      <section id="now" class="bg-white rounded-2xl border border-indigo-200 ring-1 ring-indigo-100 p-4"></section>
      <section id="who" class="hidden bg-white rounded-2xl border border-slate-200 p-4"></section>
      <section>
        <div class="text-sm font-semibold text-slate-600 mb-2 px-1">历届执委</div>
        <div id="past" class="space-y-2"></div>
        <p id="missing" class="mt-3 text-xs text-slate-500 leading-relaxed px-1"></p>
      </section>
    </div>
  </main>

  <script type="module" src="src/exco.js"></script>
</body>
</html>
