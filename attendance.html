<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>点名 - 乐韵歌咏团</title>
  <script src="src/gate.js" data-require="attendance"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-[100dvh] font-sans">
  <main class="max-w-2xl mx-auto px-4 py-5 pb-24">

    <header class="flex flex-wrap items-end justify-between gap-3 mb-4">
      <div>
        <div class="text-xs text-slate-400 tracking-widest">SIC 乐韵歌咏团</div>
        <h1 class="text-xl font-semibold">点名 / 出席率</h1>
      </div>
      <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-sm">
        <a href="members.html" class="text-slate-500 hover:text-indigo-600">团员名单</a>
        <a href="/" class="text-slate-500 hover:text-indigo-600">← 回乐谱</a>
      </div>
    </header>

    <div class="flex gap-1 bg-slate-200/70 rounded-xl p-1 mb-4 text-sm font-semibold">
      <button data-tab="roll" class="tab flex-1 py-2 rounded-lg">📋 点名</button>
      <button data-tab="stats" class="tab flex-1 py-2 rounded-lg">📊 出席率</button>
    </div>

    <!-- 点名 -->
    <section id="tab-roll" class="space-y-3">
      <div class="bg-white rounded-2xl border border-slate-200 p-3.5 text-sm space-y-2.5">
        <div class="flex flex-wrap gap-2">
          <input id="r-date" type="date" class="border border-slate-300 rounded-lg px-2.5 py-1.5">
          <select id="r-kind" class="border border-slate-300 rounded-lg px-2.5 py-1.5 bg-white">
            <option value="mass">弥撒</option>
            <option value="practice">练歌</option>
            <option value="other">其他活动</option>
          </select>
          <div id="r-title" class="self-center text-slate-500 min-w-0 truncate"></div>
        </div>
        <div id="r-recent" class="flex flex-wrap gap-1.5"></div>
      </div>

      <button id="r-qr" class="w-full rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 text-sm">📱 开现场 QR，让大家自己扫签到</button>

      <div id="r-count" class="bg-white rounded-2xl border border-slate-200 p-3.5 text-sm"></div>

      <div class="flex flex-wrap gap-2 text-sm">
        <input id="r-q" placeholder="找名字…" class="flex-1 min-w-[8rem] border border-slate-300 rounded-lg px-3 py-1.5 bg-white">
        <button id="r-rest" class="px-3 py-1.5 rounded-lg bg-emerald-50 text-emerald-700 hover:bg-emerald-100 font-semibold">还没点的都算出席</button>
      </div>

      <div id="r-list" class="bg-white rounded-2xl border border-slate-200 divide-y divide-slate-100"></div>
      <div class="text-right"><button id="r-del" class="hidden text-xs text-red-500 hover:underline">删掉这次的点名</button></div>
    </section>

    <!-- 出席率 -->
    <section id="tab-stats" class="hidden space-y-3">
      <div class="bg-white rounded-2xl border border-slate-200 p-3.5 text-sm space-y-2.5">
        <div class="flex flex-wrap gap-2">
          <select id="s-period" class="border border-slate-300 rounded-lg px-2.5 py-1.5 bg-white"></select>
          <select id="s-kind" class="border border-slate-300 rounded-lg px-2.5 py-1.5 bg-white">
            <option value="">弥撒 + 练歌 + 其他都算</option>
            <option value="mass">只算弥撒</option>
            <option value="practice">只算练歌</option>
          </select>
        </div>
        <div class="flex flex-wrap items-center gap-2 text-slate-600">
          章程：每 3 个月要出席
          <input id="s-need" type="number" min="1" max="60" class="w-16 border border-slate-300 rounded-lg px-2 py-1 text-center">
          次
          <span class="text-xs text-slate-400">（一年加起来 = 4 倍；有到 + 迟到早退都算出席，请假不算）</span>
        </div>
      </div>
      <div id="s-head" class="bg-white rounded-2xl border border-slate-200 p-4 text-sm space-y-1"></div>
      <div id="s-list" class="bg-white rounded-2xl border border-slate-200 divide-y divide-slate-100 text-sm"></div>
      <div class="text-right"><button id="s-copy" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-sm">复制成 WhatsApp 文字</button></div>
    </section>

    <!-- 现场 QR：放在门口给大家扫 -->
    <div id="qr-box" class="hidden fixed inset-0 z-50 bg-white overflow-y-auto">
      <div class="min-h-full flex flex-col items-center justify-center p-4 text-center">
        <div class="text-xs text-slate-400 tracking-widest">SIC 乐韵歌咏团</div>
        <div id="qr-title" class="text-xl font-semibold mt-1"></div>
        <div class="text-slate-600 mt-1">📱 到了扫一次签到，回家前再扫一次签退</div>
        <div id="qr" class="my-4 p-3 bg-white rounded-2xl border border-slate-200"></div>
        <div id="qr-count" class="text-sm text-slate-700"></div>
        <div id="qr-recent" class="text-xs text-slate-500 mt-1 max-w-md"></div>
        <div class="mt-4 flex flex-wrap items-center justify-center gap-2 text-sm text-slate-600">
          几点后到算迟到 <input id="qr-start" type="time" class="border border-slate-300 rounded-lg px-2 py-1">
          几点前走算早退 <input id="qr-end" type="time" class="border border-slate-300 rounded-lg px-2 py-1">
        </div>
        <div class="text-xs text-slate-400 mt-1">练歌 8pm–10.30pm，前后各留半小时：8.30pm 后才到算迟到，10pm 前签退算早退。空着就只记时间。</div>
        <div class="text-xs text-slate-400 mt-1">没有电话登录的人，照旧在点名表手点。QR 每 30 秒换一次，截图传出去也没用。</div>
        <button id="qr-close" class="mt-5 px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-sm font-semibold">关掉 QR</button>
      </div>
    </div>

    <div id="status" class="fixed bottom-3 left-1/2 -translate-x-1/2 text-xs bg-slate-800 text-white rounded-full px-3 py-1.5 opacity-0 transition-opacity pointer-events-none"></div>
  </main>

  <script type="module" src="src/attendance.js"></script>
</body>
</html>
