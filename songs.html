<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 加到手机主画面：一律叫「SIC乐韵」、用乐韵的 logo（不管从哪一页加） -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="SIC乐韵">
  <meta name="application-name" content="SIC乐韵">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#09090b">
  <title>歌单目录 - 乐韵歌咏团</title>
  <script src="src/gate.js"></script>
  <script src="src/nav.js" defer></script>
  <link rel="stylesheet" href="tailwind.css">
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-[100dvh] font-sans">
  <main class="max-w-2xl mx-auto px-4 py-5 pb-16">

    <header class="flex flex-wrap items-end justify-between gap-3 mb-4">
      <div>
        <div class="text-xs text-slate-400 tracking-widest">SIC 乐韵歌咏团</div>
        <h1 class="text-xl font-semibold">歌单目录</h1>
      </div>
      <button type="button" data-nav-open class="shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium bg-white hover:bg-indigo-50 text-slate-700 border border-slate-200 shadow-sm">☰ 菜单</button>
    </header>

    <div class="sticky top-0 z-10 bg-slate-50 pt-1 pb-2 space-y-2">
      <input id="q" type="search" placeholder="找歌名… （中文、英文、编号都可以）" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 bg-white text-sm">
      <div id="filters" class="no-scrollbar flex gap-1.5 overflow-x-auto text-sm"></div>
      <div id="letters" class="no-scrollbar flex gap-1 overflow-x-auto text-xs"></div>
    </div>

    <div id="loading" class="text-sm text-slate-400 text-center py-10">读取中…</div>
    <div id="list" class="space-y-3"></div>
    <div id="empty" class="hidden text-sm text-slate-400 text-center py-10">找不到这首歌</div>
  </main>

  <!-- 看谱：跟「乐谱」一样——整页放进画面；两指放大缩小（可以缩到比画面小），放大了一指拖着看；左右滑换歌；点一下谱，按钮收起／出现 -->
  <div id="viewer" class="hidden fixed inset-0 z-50 bg-zinc-950 text-zinc-200 overflow-hidden select-none">
    <div id="v-body" class="absolute inset-0 overflow-hidden" style="touch-action: none">
      <div id="v-wrap" class="w-full h-full flex justify-center items-center origin-center">
        <img id="v-img" alt="" class="max-w-full max-h-full object-contain bg-white shadow-2xl shadow-black/60 rounded-xl select-none pointer-events-none" draggable="false">
      </div>
    </div>

    <!-- 顶栏只占一排：关掉｜歌名｜全屏 -->
    <div id="v-head" class="absolute top-2 left-2 right-2 md:top-4 md:left-4 md:right-4 z-10 flex items-center gap-1.5 px-2 py-1.5 md:px-4 md:py-2.5 bg-zinc-900/80 backdrop-blur-2xl border border-white/10 rounded-2xl shadow-2xl transition-all duration-300">
      <button id="v-close" class="shrink-0 min-w-9 h-9 px-2 rounded-xl bg-white text-zinc-900 hover:bg-zinc-200 font-bold" aria-label="关掉">✕</button>
      <div class="flex-1 min-w-0 text-center px-1">
        <div id="v-title" class="text-sm md:text-lg font-bold text-white truncate"></div>
        <div id="v-sub" class="text-[11px] text-zinc-400 truncate"></div>
      </div>
      <button id="v-full" class="shrink-0 p-2 md:p-2.5 rounded-xl bg-zinc-800/80 text-zinc-300 hover:bg-zinc-700 hover:text-white border border-white/5" title="全屏">
        <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
      </button>
    </div>

    <!-- 上一首／下一首：点一下谱才出现（跟乐谱一样），平时用手指左右滑 -->
    <button id="v-prev" class="absolute left-2 md:left-6 top-1/2 -translate-y-1/2 z-10 bg-zinc-800/60 hover:bg-zinc-700/80 text-white p-3 md:p-4 rounded-full backdrop-blur-md border border-white/10 transition-all duration-300 opacity-0 pointer-events-none shadow-xl" aria-label="上一首">
      <svg class="w-6 h-6 md:w-8 md:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
    </button>
    <button id="v-next" class="absolute right-2 md:right-6 top-1/2 -translate-y-1/2 z-10 bg-zinc-800/60 hover:bg-zinc-700/80 text-white p-3 md:p-4 rounded-full backdrop-blur-md border border-white/10 transition-all duration-300 opacity-0 pointer-events-none shadow-xl" aria-label="下一首">
      <svg class="w-6 h-6 md:w-8 md:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
    </button>

    <!-- 左下：第几首、接下来哪一台要唱 -->
    <div id="v-toast" class="absolute bottom-4 left-3 md:bottom-8 md:left-6 z-10 bg-zinc-900/90 backdrop-blur-md border border-white/10 text-white px-4 py-3 rounded-xl shadow-2xl translate-y-4 opacity-0 pointer-events-none transition-all duration-300 flex flex-col max-w-[calc(100vw-9rem)] md:max-w-md">
      <span id="v-num" class="text-indigo-400 font-black text-[10px] tracking-wider mb-1"></span>
      <span id="v-info" class="text-xs leading-snug break-words"></span>
    </div>

    <!-- 右下：🎧 录音（Google Drive／YouTube 连结，按了另外打开来听；后台的人可以加）、🔗 分享 -->
    <div id="v-dock" class="absolute right-3 bottom-4 md:right-6 md:bottom-8 z-10 flex flex-col items-end gap-2 transition-all duration-300" style="margin-bottom: env(safe-area-inset-bottom, 0px)">
      <div id="v-audio" class="hidden w-72 max-w-[calc(100vw-1.5rem)] max-h-[50dvh] overflow-y-auto p-2 rounded-2xl bg-zinc-900/95 backdrop-blur-2xl border border-white/10 shadow-2xl space-y-1"></div>
      <button id="v-share" class="flex items-center gap-1.5 h-11 px-4 rounded-full bg-zinc-800/90 backdrop-blur-xl text-zinc-200 hover:bg-zinc-700 border border-white/10 shadow-xl text-sm font-semibold">🔗 分享</button>
      <button id="v-audio-btn" class="hidden items-center gap-1.5 h-11 px-4 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white border border-indigo-400/30 shadow-xl shadow-indigo-500/25 text-sm font-bold"></button>
    </div>

    <!-- 全屏时只留这个：退出全屏 -->
    <button id="v-unlock" class="hidden absolute top-4 right-4 z-20 p-3 bg-zinc-900/50 backdrop-blur-md text-white/40 hover:text-white rounded-full border border-white/10 shadow-xl" title="退出全屏">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 9V4.5M9 9H4.5M9 9L3.75 3.75M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M15 9h4.5M15 9V4.5M15 9l5.25-5.25M15 15h4.5M15 15v4.5m0-4.5l5.25 5.25"></path></svg>
    </button>
  </div>

  <div id="status" class="fixed bottom-3 left-1/2 -translate-x-1/2 z-[60] text-xs bg-slate-800 text-white rounded-full px-3 py-1.5 opacity-0 transition-opacity pointer-events-none"></div>

  <script type="module" src="src/songs.js"></script>
</body>
</html>
