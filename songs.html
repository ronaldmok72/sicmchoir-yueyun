<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歌单目录 - 乐韵歌咏团</title>
  <script src="src/gate.js"></script>
  <script src="src/nav.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-[100dvh] font-sans">
  <main class="max-w-2xl mx-auto px-4 py-5 pb-16">

    <header class="flex flex-wrap items-end justify-between gap-3 mb-4">
      <div>
        <div class="text-xs text-slate-400 tracking-widest">SIC 乐韵歌咏团</div>
        <h1 class="text-xl font-semibold">歌单目录</h1>
      </div>
      <button type="button" data-nav-open class="shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium bg-white hover:bg-indigo-50 text-slate-700 border border-slate-200 shadow-sm">☰ 菜单</button>
    </header>

    <div class="sticky top-0 z-10 bg-slate-50 pt-1 pb-2 space-y-2">
      <input id="q" type="search" placeholder="找歌名… （中文、英文、编号都可以）" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 bg-white text-sm">
      <div id="filters" class="no-scrollbar flex gap-1.5 overflow-x-auto text-sm"></div>
      <div id="letters" class="no-scrollbar flex gap-1 overflow-x-auto text-xs"></div>
    </div>

    <div id="loading" class="text-sm text-slate-400 text-center py-10">读取中…</div>
    <div id="list" class="space-y-3"></div>
    <div id="empty" class="hidden text-sm text-slate-400 text-center py-10">找不到这首歌</div>
  </main>

  <!-- 看谱 -->
  <div id="viewer" class="hidden fixed inset-0 z-50 bg-slate-900 flex flex-col">
    <div class="flex items-center gap-2 px-3 py-2 text-white shrink-0">
      <button id="v-close" class="w-9 h-9 rounded-lg hover:bg-white/10 text-lg" aria-label="关掉">✕</button>
      <div class="flex-1 min-w-0">
        <div id="v-title" class="font-semibold truncate"></div>
        <div id="v-sub" class="text-[11px] text-slate-400 truncate"></div>
      </div>
      <button id="v-audio-add" class="hidden px-2.5 h-9 rounded-lg hover:bg-white/10 text-sm" aria-label="加录音">🎧＋</button>
      <button id="v-zoom" class="px-2.5 h-9 rounded-lg hover:bg-white/10 text-sm" aria-label="放大">🔍 放大</button>
      <button id="v-share" class="px-2.5 h-9 rounded-lg hover:bg-white/10 text-sm" aria-label="复制连结">🔗</button>
    </div>
    <!-- 录音：边看谱边听（全团、各声部…）；后台的人可以加 -->
    <div id="v-audio" class="hidden shrink-0 bg-slate-800 text-white px-3 py-2 space-y-2 max-h-[40dvh] overflow-y-auto"></div>
    <input id="v-audio-file" type="file" accept="audio/*,.m4a,.mp3,.wav,.aac" class="hidden">
    <div id="v-body" class="flex-1 overflow-auto bg-white">
      <img id="v-img" alt="" class="block mx-auto w-full max-w-3xl">
    </div>
    <div class="flex items-center gap-2 px-3 py-2 text-white text-sm shrink-0">
      <button id="v-prev" class="px-3 h-9 rounded-lg bg-white/10 hover:bg-white/20">‹ 上一首</button>
      <div id="v-info" class="flex-1 min-w-0 text-center text-[11px] text-slate-300 truncate"></div>
      <button id="v-next" class="px-3 h-9 rounded-lg bg-white/10 hover:bg-white/20">下一首 ›</button>
    </div>
  </div>

  <div id="status" class="fixed bottom-3 left-1/2 -translate-x-1/2 z-[60] text-xs bg-slate-800 text-white rounded-full px-3 py-1.5 opacity-0 transition-opacity pointer-events-none"></div>

  <script type="module" src="src/songs.js"></script>
</body>
</html>
