<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>改名记录 - 乐韵歌咏团</title>
  <script src="src/gate.js" data-require="access"></script>
  <script src="src/nav.js" defer></script>
  <link rel="stylesheet" href="tailwind.css">
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-[100dvh] font-sans">
  <main class="max-w-2xl mx-auto px-4 py-5 pb-16">

    <header class="flex flex-wrap items-end justify-between gap-3 mb-5">
      <div>
        <div class="text-xs text-slate-400 tracking-widest">SIC 乐韵歌咏团</div>
        <h1 class="text-xl font-semibold">改名记录</h1>
      </div>
      <button type="button" data-nav-open class="shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium bg-white hover:bg-indigo-50 text-slate-700 border border-slate-200 shadow-sm">☰ 菜单</button>
    </header>

    <p class="text-sm text-slate-600 mb-3">每一次改歌名都记在这里（乐谱指挥模式、排单后台都算）。改错了可以复制旧名字，或直接按「改回这个名字」。</p>
    <input id="q" placeholder="找歌名…" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mb-4 bg-white">

    <section id="list" class="space-y-2"></section>
    <div id="status" class="text-xs text-slate-400 text-center mt-6">读取中…</div>
  </main>

  <script type="module" src="src/renames.js"></script>
</body>
</html>
