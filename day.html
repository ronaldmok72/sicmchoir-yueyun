<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>这台弥撒 - 乐韵歌咏团</title>
  <script src="src/gate.js"></script>
  <script src="src/nav.js" defer></script>
  <link rel="stylesheet" href="tailwind.css">
  <style>
    summary::-webkit-details-marker { display: none; }
    body { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-[100dvh] font-sans">
  <main class="max-w-3xl mx-auto px-4 py-5 pb-16">

    <header class="flex flex-wrap items-end justify-between gap-3 mb-4">
      <div>
        <div class="text-xs text-slate-400 tracking-widest">SIC 乐韵歌咏团</div>
        <h1 class="text-xl font-semibold">这台弥撒</h1>
      </div>
      <div class="shrink-0 flex items-center gap-2">
        <a href="/?score=1" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 text-white shadow-sm">🎼 看乐谱</a>
        <button type="button" data-nav-open class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium bg-white hover:bg-indigo-50 text-slate-700 border border-slate-200 shadow-sm">☰ 菜单</button>
      </div>
    </header>

    <!-- 哪一天 -->
    <nav id="dates" class="no-scrollbar flex gap-2 overflow-x-auto -mx-4 px-4 pb-1 mb-4"></nav>

    <div id="loading" class="text-sm text-slate-400 text-center py-10">读取中…</div>
    <div id="day" class="hidden space-y-3">
      <section id="head" class="bg-white rounded-2xl border border-slate-200 p-4"></section>
      <section id="rsvp" class="hidden bg-white rounded-2xl border border-slate-200 p-4"></section>
      <div id="specials" class="hidden space-y-3"></div>
      <details id="prayer" class="hidden group bg-white rounded-2xl border border-slate-200 p-4"></details>
      <section id="todo" class="hidden rounded-2xl border p-4 text-sm"></section>
      <section id="songs" class="bg-white rounded-2xl border border-slate-200 p-4"></section>
      <section id="people" class="bg-white rounded-2xl border border-slate-200 p-4"></section>
      <section id="seats" class="bg-white rounded-2xl border border-slate-200 p-4"></section>
      <section id="photos" class="hidden bg-white rounded-2xl border border-slate-200 p-4"></section>
      <section id="notices" class="hidden bg-white rounded-2xl border border-slate-200 p-4"></section>
    </div>

    <div class="text-center mt-8">
      <button id="btn-staff" class="text-xs text-slate-400 hover:text-indigo-600">🔒 后台登入（看要处理的事）</button>
    </div>
  </main>

  <script src="src/login.js"></script>
  <script type="module" src="src/day.js"></script>
  <script type="module" src="src/checkin-pill.js"></script>
</body>
</html>
