<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 加到手机主画面：一律叫「SIC乐韵」、用乐韵的 logo（不管从哪一页加） -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="SIC乐韵">
  <meta name="application-name" content="SIC乐韵">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#09090b">
  <title>测验后台 - 乐韵歌咏团</title>
  <script src="src/gate.js"></script>
  <script src="src/nav.js" defer></script>
  <link rel="stylesheet" href="tailwind.css">
  <style>
    th { position: sticky; top: 0; }
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-[100dvh] font-sans">

  <!-- 密码 -->
  <section id="gate" class="max-w-sm mx-auto px-4 pt-24">
    <h1 class="text-lg font-semibold mb-1">测验后台</h1>
    <p class="text-sm text-slate-500 mb-5">要有开「测验结果」的密码。</p>
    <form id="gate-form" class="flex gap-2">
      <input id="gate-pwd" type="password" class="flex-1 border border-slate-300 rounded-lg px-3 py-2.5 outline-none focus:ring-2 focus:ring-indigo-400" placeholder="密码">
      <button class="px-5 rounded-lg bg-indigo-600 text-white">进入</button>
    </form>
    <p id="gate-err" class="hidden text-sm text-red-500 mt-3">密码不对。</p>
  </section>

  <main id="app" class="hidden max-w-6xl mx-auto px-4 py-6 space-y-8">
    <header class="flex flex-wrap items-end justify-between gap-3">
      <div>
        <div class="text-xs text-slate-400 tracking-widest">SIC 乐韵歌咏团</div>
        <h1 class="text-xl font-semibold">测验后台</h1>
      </div>
      <div class="flex items-center gap-4 text-sm">
        <label class="flex items-center gap-2"><input id="latest-only" type="checkbox" checked> 每人只看最新一份</label>
        <button id="btn-reload" class="px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-white">重新整理</button>
        <button type="button" data-nav-open class="shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium bg-white hover:bg-indigo-50 text-slate-700 border border-slate-200 shadow-sm">☰ 菜单</button>
      </div>
    </header>

    <section class="bg-white rounded-2xl border border-slate-200 p-5 flex flex-wrap items-center gap-3">
      <div class="flex-1 min-w-[12rem]">
        <div id="qs-state" class="font-semibold">读取中…</div>
        <div id="qs-sub" class="text-xs text-slate-500 mt-0.5"></div>
      </div>
      <button id="qs-btn" class="hidden px-4 py-2 rounded-lg font-semibold text-white"></button>
    </section>

    <section>
      <div id="headline" class="text-lg leading-relaxed"></div>
    </section>

    <section class="grid md:grid-cols-2 gap-4">
      <div class="bg-white rounded-2xl border border-slate-200 p-5">
        <h2 class="font-semibold mb-4">全团平均（答对几成）</h2>
        <div id="team-bars" class="space-y-3"></div>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-5">
        <h2 class="font-semibold mb-4">谁想当领唱、指挥</h2>
        <div id="team-intent" class="space-y-3 text-sm"></div>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-5">
        <h2 class="font-semibold mb-4">听拍子（全团）</h2>
        <div id="team-tap" class="space-y-2 text-sm"></div>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-5">
        <h2 class="font-semibold mb-4">声部、有把握的、想加强的</h2>
        <div id="team-misc" class="space-y-3 text-sm"></div>
      </div>
    </section>

    <section class="bg-white rounded-2xl border border-slate-200 p-5">
      <h2 class="font-semibold mb-1">每个人</h2>
      <p class="text-xs text-slate-500 mb-4">点名字看他答错哪几题。"能力分"是你自己看平时上场表现打的（1 = 还要带，5 = 可以独当一面），只有你看得到。</p>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="text-left text-slate-500 bg-white">
            <tr class="border-b border-slate-200">
              <th class="py-2 pr-3">名字</th><th class="py-2 pr-3">总分</th>
              <th class="py-2 pr-3">基本功</th><th class="py-2 pr-3">领唱</th><th class="py-2 pr-3">指挥</th><th class="py-2 pr-3">礼仪</th>
              <th class="py-2 pr-3">拍子</th><th class="py-2 pr-3">进歌</th>
              <th class="py-2 pr-3">想领唱</th><th class="py-2 pr-3">想指挥</th><th class="py-2 pr-3">声部</th>
              <th class="py-2 pr-3">能力分</th><th class="py-2"></th>
            </tr>
          </thead>
          <tbody id="people"></tbody>
        </table>
      </div>
    </section>

    <section class="bg-white rounded-2xl border border-slate-200 p-5">
      <h2 class="font-semibold mb-1">每一题全团答对多少</h2>
      <p class="text-xs text-slate-500 mb-4">从最多人错的排起。最上面那几题，就是下次要再教的地方。</p>
      <div id="per-question" class="space-y-3 text-sm"></div>
    </section>
  </main>

  <script type="module" src="src/quiz-admin.js"></script>
</body>
</html>
