<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 加到手机主画面：一律叫「SIC乐韵」、用乐韵的 logo（不管从哪一页加） -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="SIC乐韵">
  <meta name="application-name" content="SIC乐韵">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#09090b">
  <title>礼仪日历 - 乐韵歌咏团</title>
  <script src="src/i18n.js"></script>
  <script src="src/gate.js"></script>
  <script src="src/nav.js" defer></script>
  <link rel="stylesheet" href="tailwind.css">
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-[100dvh] font-sans">
  <main class="max-w-2xl mx-auto px-4 py-5 pb-24">

    <header class="flex flex-wrap items-end justify-between gap-3 mb-4">
      <div>
        <div class="text-xs text-slate-400 tracking-widest">SIC 乐韵歌咏团</div>
        <h1 class="text-xl font-semibold">礼仪日历</h1>
      </div>
      <button type="button" data-nav-open class="shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium bg-white hover:bg-indigo-50 text-slate-700 border border-slate-200 shadow-sm">☰ 菜单</button>
    </header>

    <section id="cycle" class="bg-white rounded-2xl border border-indigo-200 ring-1 ring-indigo-100 p-4"></section>

    <div class="mt-4 flex flex-wrap items-center gap-2">
      <button type="button" data-range="3">3 个月</button>
      <button type="button" data-range="6">6 个月</button>
      <button type="button" data-range="12">1 年</button>
      <select id="year" class="px-2 py-1.5 rounded-lg text-sm border border-slate-200 bg-white text-slate-700"></select>
      <button type="button" id="copy" class="ml-auto px-3 py-1.5 rounded-lg text-sm border border-slate-200 bg-white text-slate-700">📋 复制成文字</button>
    </div>
    <p class="mt-2 text-xs text-slate-500 leading-relaxed px-1">照礼仪年历推算（复活节倒推圣灰、升天、圣神降临）。平日的大日子照往年歌单看几年唱过；真正的时间、练歌有没有改，看「这台弥撒」和公告。</p>

    <div id="list" class="mt-2 space-y-2"></div>
  </main>

  <script type="module" src="src/calendar.js"></script>
</body>
</html>
