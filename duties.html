<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>职务表 - 乐韵歌咏团</title>
  <script src="src/gate.js" data-require="duties"></script>
  <script src="src/nav.js" defer></script>
  <link rel="stylesheet" href="tailwind.css">
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-[100dvh] font-sans">
  <main class="max-w-3xl mx-auto px-4 py-5 pb-28">

    <header class="flex flex-wrap items-end justify-between gap-3 mb-5">
      <div>
        <div class="text-xs text-slate-400 tracking-widest">SIC 乐韵歌咏团</div>
        <h1 class="text-xl font-semibold">职务表</h1>
      </div>
      <button type="button" data-nav-open class="shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium bg-white hover:bg-indigo-50 text-slate-700 border border-slate-200 shadow-sm">☰ 菜单</button>
    </header>

    <!-- 第一次：导入 -->
    <section id="seed-box" class="hidden bg-indigo-50 border border-indigo-200 rounded-2xl p-4 mb-4 text-sm space-y-2">
      <div class="font-semibold text-indigo-900">职务表还是空的</div>
      <div class="text-indigo-800">可以先导入 2026 Google Sheet 职务表的 <b id="seed-count"></b> 场（谁当指挥、答唱咏、琴师…），以后排答唱咏才看得到每个人今年做了几次。</div>
      <button id="btn-seed" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold">导入职务表</button>
    </section>

    <div class="flex flex-wrap gap-2 items-center mb-3">
      <select id="range" class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white">
        <option value="next">接下来的</option>
        <option value="year">今年全部</option>
      </select>
      <button id="btn-fill" class="px-3 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-sm" title="指挥、钢琴、风琴、鼓手空着的，照上一场的人填">⚡ 固定的照上一场补</button>
      <button id="btn-add-date" class="px-3 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-sm">＋ 加一个日期</button>
    </div>
    <div id="hint" class="text-xs text-slate-400 mb-3">点格子选人。答唱咏会先列出今年做得比较少的人。</div>

    <section id="list" class="space-y-2.5"></section>

    <details id="stats" class="mt-6 bg-white rounded-2xl border border-slate-200 p-4 text-sm">
      <summary class="cursor-pointer font-semibold">今年谁做了几次</summary>
      <div id="stats-body" class="mt-3 space-y-3"></div>
    </details>
    <div id="status-line" class="text-xs text-slate-400 text-center mt-6"></div>
  </main>

  <!-- 底部 -->
  <div class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur border-t border-slate-200">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-2">
      <span id="status" class="text-xs text-slate-500 flex-1 min-w-0 truncate"></span>
      <button id="btn-copy" class="px-4 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold whitespace-nowrap">复制接下来 4 场</button>
    </div>
  </div>

  <!-- 选人弹窗 -->
  <div id="picker" class="hidden fixed inset-0 z-50 bg-slate-900/40 flex items-end sm:items-center justify-center">
    <div class="bg-white w-full sm:max-w-lg sm:rounded-2xl rounded-t-2xl max-h-[85dvh] flex flex-col">
      <div class="p-4 border-b border-slate-100 space-y-2">
        <div class="flex justify-between items-center">
          <h2 id="picker-title" class="font-semibold"></h2>
          <button id="picker-close" class="text-slate-400 hover:text-slate-700 px-2 text-lg">✕</button>
        </div>
        <input id="picker-search" type="search" placeholder="搜名字；名单外的人直接打名字按 Enter" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
      </div>
      <div id="picker-list" class="overflow-y-auto p-2"></div>
      <div class="p-3 border-t border-slate-100 flex gap-2">
        <button id="picker-clear" class="px-3 py-2 rounded-lg text-sm text-red-500 hover:bg-red-50">清空这一格</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/duties.js"></script>
</body>
</html>
