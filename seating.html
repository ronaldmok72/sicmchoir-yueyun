<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>座位表 - 乐韵歌咏团</title>
  <script src="src/gate.js" data-require="seating"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .seat.drop-over, .tray.drop-over { outline: 2px dashed #6366f1; outline-offset: 2px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-[100dvh] font-sans">
  <main class="max-w-3xl mx-auto px-4 py-5 pb-28">

    <header class="flex flex-wrap items-end justify-between gap-3 mb-5">
      <div>
        <div class="text-xs text-slate-400 tracking-widest">SIC 乐韵歌咏团</div>
        <h1 class="text-xl font-semibold">座位表</h1>
      </div>
      <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-sm">
        <a href="day.html" data-day-link class="text-indigo-600 hover:text-indigo-500 font-medium">📅 总览</a>
        <a href="duties.html" class="text-slate-500 hover:text-indigo-600">职务表</a>
        <a href="members.html" class="text-slate-500 hover:text-indigo-600">团员名单</a>
        <a href="/" class="text-slate-500 hover:text-indigo-600">← 回乐谱</a>
      </div>
    </header>

    <!-- 第一次：导入 -->
    <section id="seed-box" class="hidden bg-indigo-50 border border-indigo-200 rounded-2xl p-4 mb-4 text-sm space-y-2">
      <div class="font-semibold text-indigo-900">座位表还是空的</div>
      <div class="text-indigo-800">可以先导入 Google Sheet 里 11/10 那一次的座位，以后每个礼拜「照上一次排」就好。</div>
      <button id="btn-seed" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold">导入 11/10 座位</button>
    </section>

    <div class="flex flex-wrap gap-2 items-center mb-2">
      <select id="date" class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white flex-1 min-w-[12rem]"></select>
      <select id="rearrange" class="px-3 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-sm border-0">
        <option value="">⚡ 重新排…</option>
        <option value="prev">照上一次的座位</option>
        <option value="gender">女生在前、男生在后</option>
        <option value="voice">按声部一排一排（S／A／主旋律／T／B）</option>
      </select>
    </div>
    <div id="stage" class="text-sm text-slate-600 mb-3"></div>

    <!-- 座位 -->
    <section class="bg-white rounded-2xl border border-slate-200 p-2 sm:p-3 mb-3">
      <div class="text-center text-xs text-slate-400 mb-2">▲ 前面（祭台／指挥）</div>
      <div id="grid" class="space-y-1.5"></div>
      <div class="flex flex-wrap gap-2 items-center justify-between mt-3 text-xs text-slate-500">
        <div class="flex gap-1.5">
          <button id="btn-row-add" class="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200">＋ 一排</button>
          <button id="btn-row-del" class="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200">－ 最后一排</button>
        </div>
        <label class="flex items-center gap-1.5">每排
          <select id="cols" class="border border-slate-300 rounded-md px-1.5 py-1 bg-white">
            <option>4</option><option>5</option><option>6</option><option>7</option><option>8</option>
          </select> 个位
        </label>
      </div>
      <div class="flex flex-wrap gap-x-3 gap-y-1 mt-3 text-[11px] text-slate-500" id="legend"></div>
    </section>

    <!-- 选中一个人时的动作 -->
    <div id="action-bar" class="hidden sticky top-2 z-20 bg-indigo-600 text-white rounded-xl px-3 py-2 mb-3 text-sm flex flex-wrap items-center gap-2 shadow-lg">
      <span id="action-text" class="basis-full sm:basis-auto sm:flex-1 min-w-0"></span>
      <button id="act-unseat" class="px-2.5 py-1 rounded-md bg-white/15 hover:bg-white/25">放回去</button>
      <button id="act-absent" class="px-2.5 py-1 rounded-md bg-white/15 hover:bg-white/25">今天没来</button>
      <button id="act-cancel" class="px-2.5 py-1 rounded-md bg-white/15 hover:bg-white/25">取消</button>
      <div id="act-edit" class="hidden w-full flex flex-wrap items-center gap-x-3 gap-y-1.5 pt-1.5 border-t border-white/20 text-xs">
        <label class="flex items-center gap-1.5">这场披肩 #
          <input id="act-cape" type="number" min="1" inputmode="numeric" class="w-14 rounded-md px-1.5 py-0.5 text-slate-800 text-sm">
          <span id="act-cape-hint" class="opacity-70"></span>
        </label>
        <span class="flex items-center gap-1">这场唱 <span id="act-voices" class="flex gap-1"></span></span>
      </div>
    </div>

    <!-- 还没排的 -->
    <section class="mb-3">
      <div class="text-xs font-semibold text-slate-500 mb-1.5">还没排座位的 <span id="tray-count"></span><span class="font-normal text-slate-400">　没来的不用理</span></div>
      <div id="tray" class="tray flex flex-wrap gap-1.5 min-h-[2.5rem] bg-white rounded-2xl border border-slate-200 p-2.5"></div>
      <div class="text-xs text-slate-400 mt-1.5">点一个人，再点座位就放进去。点两个座位会对调。电脑可以直接拖。</div>
    </section>

    <section id="absent-box" class="hidden mb-3">
      <div class="text-xs font-semibold text-slate-500 mb-1.5">今天没来（点一下放回来）</div>
      <div id="absent" class="flex flex-wrap gap-1.5"></div>
    </section>

    <!-- 披肩 -->
    <section class="bg-white rounded-2xl border border-slate-200 p-4 text-sm space-y-2">
      <div class="font-semibold">今天的披肩</div>
      <div id="capes"></div>
    </section>
  </main>

  <div class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur border-t border-slate-200">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-2">
      <span id="status" class="text-xs text-slate-500 flex-1 min-w-0 truncate"></span>
      <button id="btn-copy" class="px-4 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold whitespace-nowrap">复制座位表文字</button>
    </div>
  </div>

  <script type="module" src="src/seating.js"></script>
</body>
</html>
