<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>练习前祈祷文 - 乐韵歌咏团</title>
  <script src="src/gate.js"></script>
  <script src="src/nav.js" defer></script>
  <link rel="stylesheet" href="tailwind.css">
  <link rel="manifest" href="manifest.json">
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .prayer { font-size: 1.15rem; line-height: 2; letter-spacing: .02em; }
  </style>
</head>
<body class="bg-stone-50 text-stone-800 min-h-[100dvh] font-sans">
  <main class="max-w-xl mx-auto px-4 py-5 pb-28">
    <header class="flex items-end justify-between gap-3 mb-4">
      <div>
        <div class="text-xs text-stone-400 tracking-widest">SIC 乐韵歌咏团</div>
        <h1 class="text-xl font-semibold">🙏 练习前祈祷文</h1>
      </div>
      <button type="button" data-nav-open class="shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium bg-white hover:bg-indigo-50 text-slate-700 border border-slate-200 shadow-sm">☰ 菜单</button>
    </header>

    <!-- 哪一个主日 -->
    <div class="flex items-center gap-2 mb-4">
      <button id="prev" class="w-10 h-10 rounded-full bg-white border border-stone-200 hover:border-indigo-300 text-stone-500" aria-label="上一个主日">‹</button>
      <div class="flex-1 text-center">
        <div id="sun-name" class="font-semibold text-lg"></div>
        <div id="sun-sub" class="text-xs text-stone-500"></div>
      </div>
      <button id="next" class="w-10 h-10 rounded-full bg-white border border-stone-200 hover:border-indigo-300 text-stone-500" aria-label="下一个主日">›</button>
    </div>

    <div id="status" class="text-sm text-stone-400 text-center py-6">读取中…</div>

    <article id="text" class="hidden space-y-5">
      <section id="missing" class="hidden rounded-2xl bg-amber-50 border border-amber-200 p-4 text-sm space-y-2">
        <div class="font-semibold text-amber-900">这个主日的进堂咏、集祷经还没有人输入</div>
        <div class="text-amber-800">打开弥撒经书（感恩祭典）那一页，打字贴进来或拍照上传，<b>一次就好</b>——明年同一个主日会自己出来。</div>
        <button id="btn-add" class="px-4 py-2 rounded-lg bg-amber-600 hover:bg-amber-500 text-white font-semibold">✏️ 输入这一页</button>
      </section>

      <section id="sec-entrance" class="bg-white rounded-2xl border border-stone-200 p-5">
        <div class="flex items-baseline gap-2 mb-2"><h2 class="font-semibold text-indigo-700">进堂咏</h2><span id="entrance-ref" class="text-sm text-stone-400"></span></div>
        <p id="entrance" class="prayer"></p>
      </section>
      <section id="sec-collect" class="bg-white rounded-2xl border border-stone-200 p-5">
        <h2 class="font-semibold text-indigo-700 mb-2">集祷经</h2>
        <p class="text-sm text-stone-400 mb-1">请大家祈祷：</p>
        <p id="collect" class="prayer"></p>
      </section>
      <img id="photo" class="hidden w-full rounded-2xl border border-stone-200" alt="经书这一页">
      <section class="bg-white rounded-2xl border border-stone-200 p-5">
        <h2 class="font-semibold text-indigo-700 mb-2">圣女则济利亚祷文</h2>
        <p id="cecilia" class="prayer"></p>
      </section>
      <button id="btn-edit" class="hidden w-full text-xs text-stone-400 hover:text-indigo-600">✏️ 有打错？改这一页</button>
    </article>
  </main>

  <!-- 底部 -->
  <div class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur border-t border-stone-200">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center gap-2">
      <span id="msg" class="text-xs text-stone-500 flex-1 min-w-0 truncate"></span>
      <button id="btn-copy" class="px-4 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold whitespace-nowrap">📋 复制给 WhatsApp</button>
    </div>
  </div>

  <!-- 输入／改 -->
  <div id="editor" class="hidden fixed inset-0 z-50 bg-stone-900/40 flex items-end sm:items-center justify-center">
    <form id="f" class="bg-white w-full sm:max-w-lg sm:rounded-2xl rounded-t-2xl max-h-[92dvh] overflow-y-auto p-4 space-y-3 text-sm">
      <div class="flex justify-between items-center">
        <h2 id="ed-title" class="font-semibold text-base"></h2>
        <button type="button" id="ed-close" class="text-stone-400 hover:text-stone-700 px-2 text-lg">✕</button>
      </div>
      <div class="text-xs text-stone-500">照经书打字（或贴上），也可以只拍照上传。存一次，明年同一个主日就会自己出来。</div>
      <label class="block space-y-1"><span class="text-stone-500">进堂咏的出处（例如：咏 16:6,8）</span>
        <input name="ref" class="w-full border border-stone-300 rounded-lg px-3 py-2"></label>
      <label class="block space-y-1"><span class="text-stone-500">进堂咏</span>
        <textarea name="entrance" rows="4" class="w-full border border-stone-300 rounded-lg px-3 py-2"></textarea></label>
      <label class="block space-y-1"><span class="text-stone-500">集祷经（「请大家祈祷」后面那一段）</span>
        <textarea name="collect" rows="5" class="w-full border border-stone-300 rounded-lg px-3 py-2"></textarea></label>
      <label class="block space-y-1"><span class="text-stone-500">📷 经书那一页的照片（可以不放）</span>
        <input name="photo" type="file" accept="image/*" class="block w-full text-xs"></label>
      <div id="ed-photo" class="text-xs text-stone-400"></div>
      <div class="flex items-center gap-2 pt-1">
        <span id="ed-err" class="text-xs text-red-500 flex-1"></span>
        <button id="ed-save" class="px-5 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold">保存</button>
      </div>
    </form>
  </div>

  <script src="src/login.js"></script>
  <script type="module" src="src/prayer.js"></script>
</body>
</html>
